# Stux.Design Status: https://status.stux.design
# Checked every 5 minutes by .github/workflows/status.yml, using GitHup:
# https://github.com/StuxGroup/GitHup
site:
  name: Stux.Design Status
  description: Live status of Stux.Design's sites, checked every 5 minutes. Designed with purpose.
  # Its own badge icon (the Stux.Design mark with a heartbeat badge), as on services.stux.design.
  logo: https://services.stux.design/assets/img/services/stux-design-status.png
  favicon: https://services.stux.design/assets/img/services/stux-design-status.png
  accent: "#e71081"
  url: https://status.stux.design/
  footer_links:
    - label: Stux.Design Services
      url: https://services.stux.design/
    - label: Report a problem
      url: https://github.com/StuxDesign/Status/issues/new

legal:
  operator: Stux.Design
  company: "Stux.Design is operated by Stux Group Ltd, a company registered in England and Wales (company no. 13160574), registered office 82a James Carter Road, Mildenhall, England, IP28 7DE."
  contact: legal@stux.design
  host: GitHub Pages
  effective: 8 October 2026

defaults:
  timeout: 15
  retries: 2
  max_response_time: 15000  # ms; GitHup's default. Slower (but otherwise good) answers show as degraded

# Monitors are grouped into sections on the page, each with a combined status.
# Slugs come from the names, so moving a monitor between groups keeps its history.
# Only sites that serve are monitored. A site that's drawn but not live yet can go in a group as
# a plain link (`links:`) until it serves, then become a monitor.
groups:
  - name: Stux.Design
    description: The Stux.Design studio's own sites.
    monitors:
      - name: Stux.Design Website
        url: https://stux.design/
      - name: Stux.Design Services
        url: https://services.stux.design/
        description: Every Stux.Design service, in one place

  - name: Shared
    description: The media every Stux.Design site relies on.
    monitors:
      - name: Stux.Design Media CDN
        url: https://global.media.stux.design/icon.png
        description: Shared logos and images used across every Stux.Design site

  - name: Templates
    description: The page templates Stux.Design's sites fall back on.
    monitors:
      - name: Stux.Design Soonpage
        url: https://soonpage.stux.design/
        description: The coming-soon page template
      - name: Stux.Design Maintenancepage
        url: https://maintenancepage.stux.design/
        description: The maintenance page template
      - name: Stux.Design Servicepage
        url: https://servicepage.stux.design/
        description: The placeholder for services not set up yet

incidents:
  labels: [status]
